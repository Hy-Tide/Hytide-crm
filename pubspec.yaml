name: hytide
description: "Hytide Lead Management CRM — Production-Ready Flutter App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.9
  firebase_storage: ^12.4.5
  firebase_messaging: ^15.2.5
  firebase_analytics: ^11.4.6

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # UI & Design
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  fl_chart: ^0.70.2

  # Utilities
  intl: ^0.20.2
  timeago: ^3.7.0
  uuid: ^4.5.1
  equatable: ^2.0.7
  dartz: ^0.10.1

  # File Handling
  image_picker: ^1.1.2
  file_picker: ^8.3.7
  path: ^1.9.1
  mime: ^2.1.0

  # URL / Communication
  url_launcher: ^6.3.1

  # Notifications & Connectivity
  flutter_local_notifications: ^18.0.1
  connectivity_plus: ^6.1.4
  shared_preferences: ^2.5.3

  # PDF
  pdf: ^3.12.0
  printing: ^5.14.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

